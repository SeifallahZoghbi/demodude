# Mount demodude under https://<host>/demo/ . Pair with PUBLIC_BASE_PATH=/demo in
# /etc/demodude/env so the service generates matching URLs. The SSE turn stream
# needs buffering off and a long read timeout.
location /demo/ {
    proxy_pass http://127.0.0.1:8900/demo/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 64k;
}
