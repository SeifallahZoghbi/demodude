<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{APP_NAME}} demo</title>
  <link rel="stylesheet" href="{{BASE}}/static/panel.css">
</head>
<body>
  <main class="layout">
    <section class="stage">
      <iframe id="app-frame" title="{{APP_NAME}} demo" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    </section>
    <aside class="panel" aria-label="Demo guide">
      <header class="panel-head">
        <h1 id="app-name">{{APP_NAME}}</h1>
        <div class="controls">
          <button id="btn-pause" type="button" title="Pause the guide">Pause</button>
          <button id="btn-continue" type="button" title="Continue the demo">Continue</button>
          <button id="btn-restart" type="button" title="Start the demo over">Restart</button>
        </div>
      </header>
      <div id="transcript" class="transcript" aria-live="polite"></div>
      <div id="status" class="status">Connecting…</div>
      <form id="composer" class="composer" autocomplete="off">
        <input id="input" type="text" maxlength="1000" placeholder="Ask the guide anything…" aria-label="Message">
        <button id="btn-send" type="submit">Send</button>
      </form>
    </aside>
  </main>
  <script id="demo-config" type="application/json">{{CONFIG_JSON}}</script>
  <script src="{{BASE}}/static/panel.js"></script>
</body>
</html>
